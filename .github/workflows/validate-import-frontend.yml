name: Validate import/frontend

on:
  push:
    branches:
      - import/frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Praxis frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Praxis import branch
        uses: actions/checkout@v4
        with:
          ref: import/frontend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Create validation log directory
        run: mkdir -p validation-logs

      - name: Install dependencies
        working-directory: apps/web
        run: |
          pnpm install --no-frozen-lockfile --lockfile=false 2>&1 | tee ../../validation-logs/pnpm-install.log

      - name: TypeScript check
        working-directory: apps/web
        run: |
          pnpm exec tsc --noEmit 2>&1 | tee ../../validation-logs/ts-check.log

      - name: ESLint
        working-directory: apps/web
        run: |
          pnpm run lint 2>&1 | tee ../../validation-logs/eslint.log

      - name: Production build
        working-directory: apps/web
        run: |
          pnpm run build 2>&1 | tee ../../validation-logs/build.log

      - name: Start development server
        working-directory: apps/web
        run: |
          nohup pnpm run dev --host 0.0.0.0 --port 3000 > ../../validation-logs/server.log 2>&1 &
          echo $! > ../../server.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Server started successfully."
              exit 0
            fi
            sleep 2
          done

          echo "Server failed to start."
          cat ../../validation-logs/server.log
          exit 1

      - name: Smoke test routes
        run: |
          set -e

          echo "Testing /"
          curl -f -sS -o /tmp/index.html -w "HTTP %{http_code}\n" http://127.0.0.1:3000/ | tee validation-logs/smoke-tests.log

          echo "Testing /dashboard"
          curl -f -sS -o /tmp/dashboard.html -w "HTTP %{http_code}\n" http://127.0.0.1:3000/dashboard | tee -a validation-logs/smoke-tests.log

          echo "Testing /start"
          curl -f -sS -o /tmp/start.html -w "HTTP %{http_code}\n" http://127.0.0.1:3000/start | tee -a validation-logs/smoke-tests.log

          echo "All smoke tests passed."

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: validation-logs/

      - name: Validation summary
        if: always()
        run: |
          {
            echo "## Praxis frontend validation"
            echo ""
            echo "- Branch: \`import/frontend\`"
            echo "- Frontend validation completed."
            echo "- Lovable source checkout/checksum comparison: skipped"
            echo ""
            echo "See the uploaded \`validation-logs\` artifact for full output."
          } >> "$GITHUB_STEP_SUMMARY"