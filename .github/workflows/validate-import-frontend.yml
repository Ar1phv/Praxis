name: Validate import/frontend

on:
  push:
    branches:
      - import/frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Praxis frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout import/frontend
        uses: actions/checkout@v4
        with:
          ref: import/frontend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Create validation log directory
        working-directory: .
        run: mkdir -p validation-logs

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --lockfile=false \
            2>&1 | tee ../../validation-logs/pnpm-install.log

      - name: TypeScript check
        run: |
          pnpm exec tsc --noEmit \
            2>&1 | tee ../../validation-logs/ts-check.log

      - name: ESLint
        run: |
          pnpm run lint \
            2>&1 | tee ../../validation-logs/eslint.log

      - name: Production build
        run: |
          pnpm run build \
            2>&1 | tee ../../validation-logs/build.log

      - name: Start development server
        run: |
          nohup pnpm run dev --host 0.0.0.0 --port 3000 \
            > ../../validation-logs/server.log 2>&1 &

          echo $! > ../../server.pid

          echo "Waiting for Vite server..."

          for i in {1..30}; do
            if curl -sS http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Server is responding."
              exit 0
            fi

            sleep 2
          done

          echo "Server failed to respond."
          echo ""
          echo "===== SERVER LOG ====="
          cat ../../validation-logs/server.log
          exit 1

      - name: Smoke test /
        run: |
          echo "Testing /"

          status=$(curl -sS -o /tmp/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:3000/)

          echo "/ -> HTTP $status" \
            | tee ../../validation-logs/smoke-tests.log

          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Root route failed."
            exit 1
          fi

      - name: Smoke test /dashboard
        run: |
          echo "Testing /dashboard"

          status=$(curl -sS -o /tmp/dashboard.html \
            -w "%{http_code}" \
            http://127.0.0.1:3000/dashboard)

          echo "/dashboard -> HTTP $status" \
            | tee -a ../../validation-logs/smoke-tests.log

          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Dashboard route failed."
            exit 1
          fi

      - name: Smoke test /start
        run: |
          echo "Testing /start"

          status=$(curl -sS -o /tmp/start.html \
            -w "%{http_code}" \
            http://127.0.0.1:3000/start)

          echo "/start -> HTTP $status" \
            | tee -a ../../validation-logs/smoke-tests.log

          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Start route failed."
            exit 1
          fi

      - name: Stop development server
        if: always()
        working-directory: .
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: validation-logs/

      - name: Validation summary
        if: always()
        working-directory: .
        run: |
          {
            echo "## Praxis frontend validation"
            echo ""
            echo "Branch: \`import/frontend\`"
            echo ""
            echo "Validation performed:"
            echo "- pnpm install"
            echo "- TypeScript"
            echo "- ESLint"
            echo "- Production build"
            echo "- Vite development server"
            echo "- /"
            echo "- /dashboard"
            echo "- /start"
            echo ""
            echo "See the \`validation-logs\` artifact for detailed output."
          } >> "$GITHUB_STEP_SUMMARY"